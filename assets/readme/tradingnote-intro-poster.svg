  <text x="88" y="226" fill="#ffffff" font-family="Arial, sans-serif" font-size="60" font-weight="700">See your trades clearly.</text>
  <text x="90" y="277" fill="#b9d6dc" font-family="Arial, sans-serif" font-size="28">Record. Review. Understand. Test. Learn.</text>
