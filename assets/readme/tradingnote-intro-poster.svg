  </defs>
  <rect width="1200" height="675" rx="28" fill="url(#background)"/>
  <path d="M0 515 C220 450 370 555 590 485 S925 360 1200 455 L1200 675 L0 675Z" fill="#1e4252" opacity=".38"/>
